name: "Setup Node (npm)"
description: >
  Provisions a Node.js runtime for an npm project. The repository must already
  be checked out before this runs so the dependency cache can key on the lockfile.

inputs:
  runtime-version:
    description: "Node.js version to install. Empty falls back to the default."
    required: false
    default: ""
  working-directory:
    description: "Directory that contains package.json."
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.runtime-version != '' && inputs.runtime-version || '20' }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Check tooling
      shell: bash
      run: |
        echo "===== Tooling (npm) ====="
        node --version
        npm --version
        git --version
        date
