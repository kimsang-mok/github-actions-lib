name: "Setup Maven (JDK)"
description: >
  Provisions a Java runtime for a Maven project. The repository must already be
  checked out before this runs so that the dependency cache can be keyed on
  pom.xml.

inputs:
  runtime-version:
    description: "JDK version to install. Empty falls back to the default."
    required: false
    default: ""
  working-directory:
    description: "Directory that contains pom.xml."
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.runtime-version != '' && inputs.runtime-version || '21' }}
        cache: maven
        cache-dependency-path: ${{ inputs.working-directory }}/pom.xml

    - name: Check tooling
      shell: bash
      run: |
        echo "===== Tooling (maven) ====="
        java -version
        mvn -v
        git --version
        date
