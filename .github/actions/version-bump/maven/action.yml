name: "Bump Version (Maven)"
description: "Writes a new version into the Maven project. Does not commit."

inputs:
  version:
    description: "The version to set (e.g. 1.2.0 or 1.2.1-SNAPSHOT)."
    required: true
  working-directory:
    description: "Directory that contains pom.xml."
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Set version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        mvn -B versions:set -DnewVersion="${{ inputs.version }}" -DgenerateBackupPoms=false
