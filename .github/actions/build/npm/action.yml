name: "Build (npm)"
description: "Installs dependencies, builds (if a build script exists) and tests an npm project."

inputs:
  working-directory:
    description: "Directory that contains package.json."
    required: false
    default: "."
  skip-tests:
    description: "Skip the test script."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "===== Install dependencies (npm) ====="
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "===== Build (npm) ====="
        npm run build --if-present

    - name: Test
      if: ${{ inputs.skip-tests != 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "===== Test (npm) ====="
        npm test --if-present

    - name: Publish unit test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: npm-test-results
        path: |
          ${{ inputs.working-directory }}/junit.xml
          ${{ inputs.working-directory }}/test-results/**/*.xml
        if-no-files-found: ignore
